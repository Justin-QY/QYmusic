# retrofit 閰嶇疆
retrofit:
  global-log: # 鍏ㄥ眬鏃ュ織閰嶇疆
    enable: true # 寮€鍚棩蹇?
    log-level: info # 鏃ュ織绛夌骇
    log-strategy: basic # 鏃ュ織绛栫暐
    aggregate: true # 鏄惁鑱氬悎鎵撳嵃鏃ュ織

  global-retry: # 鍏ㄥ眬閲嶈瘯
    enable: true # 寮€鍚叏灞€閲嶈瘯
    interval-ms: 100 # 閲嶈瘯闂撮殧鏃堕棿
    max-retries: 2 # 鏈€澶ч噸璇曟椂闂?
    retry-rules: # 閲嶈瘯瑙﹀彂瑙勫垯
      - response_status_not_2xx # 鍝嶅簲鐮佺姸鎬佷笉姝ｇ‘
      - occur_exception # 鍑虹幇寮傚父鏃?
  global-timeout: # 鍏ㄥ眬瓒呮椂閰嶇疆
    call-timeout-ms: 0 # 鍏ㄥ眬瀹屾暣璋冪敤瓒呮椂鏃堕棿
    read-timeout-ms: 10000 # 璇诲彇瓒呮椂鏃堕棿
    write-timeout-ms: 10000 # 鍐欏叆瓒呮椂鏃堕棿
    connect-timeout-ms: 10000 # 杩炴帴瓒呮椂鏃堕棿
  # 鍏ㄥ眬杞崲鍣細榛樿宸茬粡閰嶇疆濂斤紝浣跨敤榛樿閰嶇疆
  # global-converter-factories: com.github.lianjiatech.retrofit.spring.boot.core.BasicTypeConverterFactory

