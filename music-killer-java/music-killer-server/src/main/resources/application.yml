spring:
  application:
    name: qy-music
  profiles:
    active: @env@
  servlet:
    multipart:
      # 鏈€澶т笂浼犳枃浠跺ぇ灏?
      max-file-size: 2MB
  # jackson:
    # mapper:
      # accept-case-insensitive-properties: true

# mybatis 閰嶇疆
mybatis:
  # mapper xml 璺緞
  mapper-locations: classpath:mapper/*.xml
  # 绫诲瀷鍒悕
  type-aliases-package: com.qymusic.entity

# springdoc-openapi椤圭洰閰嶇疆
springdoc:
  swagger-ui:
    path: /swagger-ui.html # swagger 璁块棶椤甸潰鍦板潃
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan:
        - com.qymusic.controller # 鎵弿 controller 鍖?
# knife4j鐨勫寮洪厤缃紝涓嶉渶瑕佸寮哄彲浠ヤ笉閰?
knife4j:
  enable: true # 寮€鍚寮洪厤缃?
  setting:
    language: zh_cn # 璇█涓枃

# jwt 閰嶇疆
jwt:
  user-secret-key: ${JWT_SECRET:QYMusicJwtSecret2026ChangeMe} # 閮ㄧ讲鏃惰閫氳繃鐜鍙橀噺瑕嗙洊
  user-token-name: Authorization # 璁よ瘉璇锋眰澶寸殑鍚嶇О
  user-ttl: 30d # 鐢ㄦ埛token杩囨湡鏃堕棿

api:
  auth:
    salt: QYMusicNativeSalt

# 涓婁紶閰嶇疆
upload:
  url: https://img.ink/api/upload # 涓婁紶鍦板潃
  token: ${UPLOAD_TOKEN:} # 涓婁紶 token锛屾寜闇€閫氳繃鐜鍙橀噺娉ㄥ叆

# mybatis-plus 閰嶇疆
